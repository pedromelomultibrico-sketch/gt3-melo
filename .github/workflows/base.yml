name: Procurar base e criar mascara de teste
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL direto de um .hwt (vazio = procurar)"
        required: false
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: pip install -q pillow requests
      - name: Procurar e construir
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          python3 - <<'PY' > relatorio.txt 2>&1 || true
          import os, io, re, json, zipfile, subprocess, requests, glob
          cand = []
          url = os.environ.get("URL") or ""
          if url:
              cand.append(url)
          print("== procura")
          try:
              r = requests.get("https://api.github.com/search/code",
                               params={"q": "extension:hwt", "per_page": 30},
                               headers={"Accept": "application/vnd.github+json",
                                        "Authorization": "Bearer " + os.environ.get("GITHUB_TOKEN", "")}, timeout=30)
              print("code search", r.status_code)
              for it in r.json().get("items", [])[:30]:
                  cand.append(it["html_url"].replace("/blob/", "/raw/"))
          except Exception as e:
              print("code search falhou", e)
          try:
              for q in ["huawei watchface hwt", "watchface gt3 huawei", "huawei watch face pack"]:
                  r = requests.get("https://api.github.com/search/repositories",
                                   params={"q": q, "per_page": 10}, timeout=30)
                  print("repo search", q, r.status_code)
                  for rep in r.json().get("items", []):
                      full, br = rep["full_name"], rep["default_branch"]
                      t = requests.get(f"https://api.github.com/repos/{full}/git/trees/{br}?recursive=1", timeout=30)
                      if t.status_code != 200:
                          continue
                      for n in t.json().get("tree", []):
                          if n["path"].lower().endswith(".hwt") and n.get("size", 0) < 8_000_000:
                              cand.append(f"https://raw.githubusercontent.com/{full}/{br}/{n['path']}")
          except Exception as e:
              print("repo search falhou", e)
          vistos, lista = set(), []
          for c in cand:
              if c not in vistos:
                  vistos.add(c); lista.append(c)
          print("candidatos:", len(lista))
          for c in lista[:10]:
              print("  ", c)
          bom = None
          for c in lista[:25]:
              try:
                  r = requests.get(c, timeout=60)
                  if r.status_code != 200 or len(r.content) < 20000:
                      continue
                  z = zipfile.ZipFile(io.BytesIO(r.content))
                  n = z.namelist()
                  if "com.huawei.watchface" in n or "com.honor.watchface" in n:
                      open("base.hwt", "wb").write(r.content)
                      print("BASE OK:", c, len(r.content), "bytes", n[:8])
                      bom = c
                      break
              except Exception as e:
                  pass
          if not bom:
              print("NENHUMA BASE ENCONTRADA")
          PY
          cat relatorio.txt
          if [ -f base.hwt ]; then
            python3 ci/mascara.py base.hwt teste.hwt "GT3 Melo teste" >> relatorio.txt 2>&1 || true
            python3 ci/sempre_ligado.py base.hwt >> relatorio.txt 2>&1 || true
          fi
          echo "--- base que vem com a app ---" >> relatorio.txt
          python3 ci/sempre_ligado.py nucleo/base-aod.hwt --exigir >> relatorio.txt 2>&1 || echo "AVISO: a base incluida ficou sem sempre ligado" >> relatorio.txt
          cat relatorio.txt
      - name: Enviar resultado
        if: always()
        run: |
          U=https://gt3-melo.pedromelomultibrico.workers.dev
          K=dd675fde21f25243db694192
          ls -la >> relatorio.txt
          curl -s -X POST --data-binary @relatorio.txt "$U/ci/$K/base"
          if [ -f teste.hwt ]; then
            base64 -w0 teste.hwt > teste.b64
            curl -s -X POST --data-binary @teste.b64 "$U/ci/$K/mascara-teste"
            base64 -w0 teste-novo.png > p.b64 && curl -s -X POST --data-binary @p.b64 "$U/ci/$K/png-novo"
            base64 -w0 teste-original.png > o.b64 && curl -s -X POST --data-binary @o.b64 "$U/ci/$K/png-original"
          fi
