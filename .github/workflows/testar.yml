name: Testar Worker
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Testes
        run: |
          U=https://gt3-melo.pedromelomultibrico-sketch.workers.dev
          U=https://gt3-melo.pedromelomultibrico.workers.dev
          K=dd675fde21f25243db694192
          python3 - <<'PY'
          import sys, json, base64
          sys.path.insert(0, "ci")
          from mascara import desenho_teste
          import io
          im = desenho_teste(466, 466).convert("RGB")
          b = io.BytesIO(); im.save(b, "JPEG", quality=85)
          d = base64.b64encode(b.getvalue()).decode()
          pedido = ("Esta fotografia mostra o mostrador de um relogio. Reproduz o arranjo em JSON puro: "
                    '{"nome":"...","fundo":{"tipo":"cor|gradiente","cor1":"#hex","cor2":"#hex","angulo":0},'
                    '"camadas":[{"tipo":"hora|minutos_ponteiros|data|bateria|passos|batimentos|texto|anel|marcas",'
                    '"x":233,"y":233,"tamanho":80,"cor":"#hex","fonte":"Inter","peso":400,"texto":"","espessura":4}]}')
          json.dump({"chave": "dd675fde21f25243db694192",
                     "modelo": "@cf/meta/llama-3.2-11b-vision-instruct",
                     "entrada": {"imagem_b64": d, "prompt": pedido, "max_tokens": 1200}}, open("cf.json", "w"))
          json.dump({"chave": "dd675fde21f25243db694192", "model": "claude-sonnet-5", "max_tokens": 1200,
                     "messages": [{"role": "user", "content": [
                         {"type": "image", "source": {"type": "base64", "media_type": "image/jpeg", "data": d}},
                         {"type": "text", "text": pedido}]}]}, open("cl.json", "w"))
          print("pedidos preparados")
          PY
          {
          echo "== paginas"
          for p in "" app.js hwt.js api/versao; do curl -s -o /dev/null -w "$p %{http_code}\n" $U/$p; done
          echo "== mascara de teste no servidor"; curl -s "$U/ci/$K/mascara-teste" | wc -c
          echo "== IA foto (Cloudflare)"; curl -s -X POST -H 'content-type: application/json' --data-binary @cf.json $U/api/ia/exec | head -c 1800; echo
          echo "== IA foto (Claude)"; curl -s -X POST -H 'content-type: application/json' --data-binary @cl.json $U/api/claude | head -c 1200; echo
          } > r.txt 2>&1
          cat r.txt
          curl -s -X POST --data-binary @r.txt "$U/ci/$K/teste"
