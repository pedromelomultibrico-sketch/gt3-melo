name: Procurar AOD no GitHub
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aod2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow requests
      - run: python3 ci/procurar_aod2.py || true
      - run: |
          git config user.name "GT3 Melo CI"
          git config user.email "ci@gt3melo.local"
          git add ci/relatorio-aod2.txt || true
          git add nucleo/base-aod.hwt || true
          git commit -m "relatorio aod2 [skip ci]" || exit 0
          git pull --rebase origin main
          git push
